<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="Personnage">Personnage</title><style>
:root{color-scheme:dark;--paper:#ded8b8;--ink:#514b3f;--gold:#ffc348;--line:#c5be9e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at bottom,#344327,#10150d 75%);font:13px Tahoma,Verdana,sans-serif;color:var(--ink);height:100vh;padding:14px;overflow:hidden}.sheet{height:100%;border:4px solid #fff8e2;border-radius:12px;background:var(--paper);box-shadow:0 10px 32px #0008;display:flex;flex-direction:column;overflow:hidden}header{background:#544e42;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #aa8539}h1{font-size:20px;margin:0;letter-spacing:.025em}#phase{color:#e3d8b1;font-size:11px}.vitals{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;padding:13px 16px;background:#d1caab;border-bottom:1px solid #b8af8d}.health-heading{display:flex;align-items:center;justify-content:space-between;font-weight:bold}.health-heading span:first-child{color:#9d243a}.bar{height:8px;background:#9b8d72;border-radius:8px;margin-top:7px;overflow:hidden;box-shadow:inset 0 1px 2px #0004}.bar i{display:block;height:100%;background:linear-gradient(#e75868,#ac233f);transition:width .3s}.wallet{border-left:1px solid #b8af8d;padding-left:18px;display:flex;align-items:center;gap:9px}.coin{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#ffcb48;border:2px solid #aa7c24;color:#77500d;font-weight:900;box-shadow:inset 0 0 0 2px #ffe797}.wallet b{display:block;font-size:19px;color:#645126}.wallet small{font-size:10px}.content{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;padding:12px 16px;min-height:0;flex:1}.column{overflow:auto;min-width:0}h2{font-size:13px;margin:0 0 6px;color:#544e42;border-bottom:2px solid #a69b79;padding-bottom:7px}dl{margin:0}.stat{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0;gap:7px;font-size:11px}dt{color:#6a6354}dd{margin:0;font-weight:800;white-space:nowrap;color:#3f3a30}.gear{font-size:9px;font-weight:normal;color:#75654a;text-align:right}.slot{display:flex;align-items:center;gap:9px;margin-bottom:3px;min-height:26px}.icon{flex:none;width:26px;height:26px;background:#c9c2a3;border:1px solid #9d957d;border-bottom-width:3px;border-radius:6px;display:grid;place-items:center;color:#9d957d}.icon.filled{background:radial-gradient(circle at 50% 35%,#4c4328,#202319 75%);border-color:#aa8539}.icon img{width:23px;height:23px;object-fit:contain}.slot small{display:block;font-size:9px;color:#847b64}.slot b{font-size:11px}.empty{font-size:10px;color:#968b70}.item{cursor:pointer;border-radius:6px}.item:focus-visible{outline:2px solid #aa8539}#detail{background:#c9c2a3;padding:9px;border:1px solid #9d957d;border-radius:6px;font-size:11px;line-height:1.5;margin-top:9px}#empty-state{padding:25px;text-align:center;margin:auto;line-height:1.7;color:#6a6354}#empty-state strong{display:block;font-size:20px;color:#544e42;margin-bottom:8px}[hidden]{display:none!important}@media(max-height:420px){body{padding:8px}header{padding:8px 14px}.vitals{padding:8px 14px}.stat{padding:3px 0}.content{padding:9px 14px}}@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><article class="sheet"><header><h1 data-i18n="Personnage">Personnage</h1><span id="phase">Retro Survival</span></header><div id="empty-state"><strong>À l’aventure !</strong>Lance une partie sur l’écran du haut.<br>Ton personnage et son équipement apparaîtront ici.</div><section id="run" hidden style="display:flex;flex:1;min-height:0;flex-direction:column"><div class="vitals"><div><div class="health-heading"><span data-i18n="♥ Points de vie">♥ Points de vie</span><b id="hp"></b></div><div class="bar"><i id="health"></i></div></div><div class="wallet"><span class="coin">K</span><div><b id="kamas"></b><small data-i18n="KAMAS">KAMAS</small></div></div></div><div class="content"><section class="column"><h2 data-i18n="Caractéristiques">Caractéristiques</h2><dl id="stats"></dl></section><section class="column"><h2 data-i18n="Équipement">Équipement</h2><div id="equipment"></div><div id="detail" hidden></div></section></div></section></article><script>
let previous='',selected=null,statsSignature='',equipmentSignature='';
const text=value=>window.thorLocale?.text(value)||value;
const el=id=>document.getElementById(id);
function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n;}
window.renderThorDashboard=function(data){
 window.thorLocale?.setLanguage(data.locale||'fr',false);document.documentElement.lang=data.locale||'fr';
 const serialized=JSON.stringify(data);if(previous===serialized)return;previous=serialized;
 document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=text(n.dataset.i18n);});
 const running=data.status==='run';el('run').hidden=!running;el('empty-state').hidden=running;
 if(!running){el('phase').textContent='Retro Survival';el('empty-state').replaceChildren(node('strong',data.status==='title'?text('À l’aventure !'):text('Personnage indisponible')),node('div',data.status==='title'?text('Lance une partie sur l’écran du haut. Ton personnage et son équipement apparaîtront ici.'):text('Les informations du jeu ne sont pas disponibles pour le moment.')));selected=null;statsSignature=equipmentSignature='';return;}
 el('phase').textContent=text('Niv. ')+data.level+text(' · Vague ')+data.wave+(data.phase==='paused'?text(' · Pause'):data.phase==='gameover'?text(' · Partie terminée'):'');
 el('hp').textContent=data.hp+' / '+data.maxHp;el('health').style.width=Math.max(0,Math.min(100,data.hp/Math.max(1,data.maxHp)*100))+'%';el('kamas').textContent=Number(data.kamas).toLocaleString(data.locale||'fr');
 const nextStats=JSON.stringify([data.locale,data.stats]);if(nextStats!==statsSignature){statsSignature=nextStats;el('stats').replaceChildren(...data.stats.map(s=>{const row=node('div','','stat');row.append(node('dt',s.name));const value=node('dd',s.value??'—');if(s.gear)row.title=text('Bonus équipement : ')+s.gear;row.append(value);return row;}));}
 const nextEquipment=JSON.stringify([data.locale,data.slots,data.items]);if(nextEquipment!==equipmentSignature){equipmentSignature=nextEquipment;const rows=[];for(const [key,label] of ['hat','cape','amulet','weapon','shield','belt','boots','ring','dofus'].map(key=>[key,data.slots[key]])){const items=data.items.filter(i=>i.slot===key);for(const item of items.length?items:[null]){const row=node('div','','slot'+(item?' item':''));const icon=node('span',item?'':'◇','icon'+(item?' filled':''));if(item?.icon){const img=document.createElement('img');img.src=item.icon;img.alt='';icon.append(img);}const description=node('div','');description.append(node('small',label),node(item?'b':'span',item?.name||text('Non équipé'),item?'':'empty'));row.append(icon,description);if(item){row.tabIndex=0;row.setAttribute('role','button');row.onclick=()=>{selected=item.name;showDetail(item)};row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}};}rows.push(row);}}
 el('equipment').replaceChildren(...rows);}const item=data.items.find(i=>i.name===selected);if(item)showDetail(item);else el('detail').hidden=true;
};
function showDetail(item){el('detail').hidden=false;el('detail').replaceChildren(node('b',item.name),node('div',item.effects||text('Aucun effet indiqué.')));}
</script></body></html>
