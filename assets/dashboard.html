<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="Personnage">Personnage</title><style>
:root{color-scheme:dark;--paper:#ded8b8;--ink:#514b3f;--gold:#ffc348;--line:#c5be9e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at bottom,#344327,#10150d 75%);font:13px Tahoma,Verdana,sans-serif;color:var(--ink);height:100vh;padding:14px;overflow:hidden}.sheet{height:100%;border:4px solid #fff8e2;border-radius:12px;background:var(--paper);box-shadow:0 10px 32px #0008;display:flex;flex-direction:column;overflow:hidden}header{background:#544e42;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #aa8539}h1{font-size:20px;margin:0;letter-spacing:.025em}#phase{color:#e3d8b1;font-size:11px}.vitals{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;padding:13px 16px;background:#d1caab;border-bottom:1px solid #b8af8d}.health-heading{display:flex;align-items:center;justify-content:space-between;font-weight:bold}.health-heading span:first-child{color:#9d243a}.bar{height:8px;background:#9b8d72;border-radius:8px;margin-top:7px;overflow:hidden;box-shadow:inset 0 1px 2px #0004}.bar i{display:block;height:100%;background:linear-gradient(#e75868,#ac233f);transition:width .3s}.wallet{border-left:1px solid #b8af8d;padding-left:18px;display:flex;align-items:center;gap:9px}.coin{flex:none;width:29px;height:29px;object-fit:contain}.wallet b{display:block;font-size:19px;color:#645126}.wallet small{font-size:10px}.content{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;padding:12px 16px;min-height:0;flex:1}.column{overflow:auto;min-width:0}h2{font-size:13px;margin:0 0 6px;color:#544e42;border-bottom:2px solid #a69b79;padding-bottom:7px}dl{margin:0}.stat{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0;gap:7px;font-size:11px}dt{color:#6a6354}dd{margin:0;font-weight:800;white-space:nowrap;color:#3f3a30}.gear{font-size:9px;font-weight:normal;color:#75654a;text-align:right}.slot{display:flex;align-items:center;gap:9px;margin-bottom:3px;min-height:26px}.icon{flex:none;width:26px;height:26px;background:#c9c2a3;border:1px solid #9d957d;border-bottom-width:3px;border-radius:6px;display:grid;place-items:center;color:#9d957d}.icon.filled{background:radial-gradient(circle at 50% 35%,#4c4328,#202319 75%);border-color:#aa8539}.icon img{width:23px;height:23px;object-fit:contain}.slot small{display:block;font-size:9px;color:#847b64}.slot b{font-size:11px}.empty{font-size:10px;color:#968b70}.item{cursor:pointer;border-radius:6px}.item:focus-visible{outline:2px solid #aa8539}#detail{background:#c9c2a3;padding:9px;border:1px solid #9d957d;border-radius:6px;font-size:11px;line-height:1.5;margin-top:9px}#empty-state{padding:25px;text-align:center;margin:auto;line-height:1.7;color:#6a6354}#empty-state strong{display:block;font-size:20px;color:#544e42;margin-bottom:8px}[hidden]{display:none!important}@media(max-height:420px){body{padding:8px}header{padding:8px 14px}.vitals{padding:8px 14px}.stat{padding:3px 0}.content{padding:9px 14px}}@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.collection{padding:7px 16px;background:#d5ceb0;border-bottom:1px solid #b8af8d}.collection h2{display:flex;justify-content:space-between;margin:0 0 7px}.collection h2 span:last-child{font-size:11px;color:#847b64}.relics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.relic{font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:0;padding:3px 6px;border:1px solid #a69b79;border-radius:6px;background:#eee6c6}.relic:focus-visible{outline:2px solid #aa8539}#collection-detail{font-size:11px;margin-top:6px;line-height:1.5;padding:6px;background:#eee6c6;border:1px solid #a69b79;border-radius:6px}.relic img{width:28px;height:28px;object-fit:contain;flex:none}.relic.locked{background:#c9c2a3;color:#847b64}.relic.locked img{filter:grayscale(1);opacity:.45}.relic strong{font-size:11px;display:block}.relic small{font-size:9px;display:block}.relic b{font-size:10px;display:block;color:#544e42}.collection-note{font-size:9px;color:#756b55;margin:5px 0 0}.slot.radiant{background:#eadbad;border-left:2px solid #aa8539;padding-left:5px}.radiant{border-color:#aa8539;box-shadow:inset 0 0 0 1px #ffce63}@media(max-height:420px){.collection{padding:6px 14px}.relic{padding:3px}.relic img{width:25px;height:25px}.collection-note{margin-top:3px}}
@media(max-height:520px){body{padding:10px}header{padding:8px 14px}h1{font-size:18px}h2{padding-bottom:4px}.collection{padding:6px 14px}.collection h2{margin-bottom:4px}.relic{line-height:1.2}.collection-note{margin-top:3px;line-height:1.2}.vitals{padding:9px 14px}.content{padding:8px 14px;gap:16px}.stat{padding:1px 0;line-height:1.2}}
#run.danger .vitals{background:#e6b9a4}#run.danger #health-label{color:#9d243a;font-weight:bold}
.vitals{grid-template-columns:1fr 1fr;padding:6px 14px;align-items:center}.health-block{display:flex;align-items:center;gap:9px}.heart{--heart:polygon(50% 100%,8% 55%,1% 34%,4% 15%,17% 4%,34% 5%,50% 19%,66% 5%,83% 4%,96% 15%,99% 34%,92% 55%);flex:none;width:50px;height:44px;padding:4px;clip-path:var(--heart);background:#fff;filter:drop-shadow(0 3px 0 #726b5c)}.heart>div{position:relative;width:100%;height:100%;background:#998e6d;clip-path:var(--heart);color:#fff8e4;text-shadow:0 1px 2px #2b211c}.heart-fill{position:absolute;left:0;right:0;bottom:0;background:#e2193f;transition:height .2s}.heart-values{position:absolute;left:0;right:0;bottom:4px;display:flex;flex-direction:column;align-items:center;line-height:1}.heart-values strong{font-size:13px}.heart-values i{width:17px;height:1px;background:#fff8e4;margin:1px 0}.heart-values small{font-size:8px}#health-label{font-size:11px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(prefers-reduced-motion:reduce){.heart-fill{transition:none}}
</style></head><body><article class="sheet"><header><h1 data-i18n="Personnage">Personnage</h1><span id="phase">Retro Survival</span></header><section class="collection"><h2><span data-i18n="Collection permanente">Collection permanente</span><span id="collection-count"></span></h2><div id="collection-items" class="relics"></div><p id="collection-note" class="collection-note"></p><div id="collection-detail" hidden></div></section><div id="empty-state"><strong>À l’aventure !</strong>Lance une partie sur l’écran du haut.<br>Ton personnage et son équipement apparaîtront ici.</div><section id="run" hidden style="display:flex;flex:1;min-height:0;flex-direction:column"><div class="vitals"><div class="health-block"><div id="hp-meter" class="heart" role="progressbar" aria-valuemin="0"><div><i id="health" class="heart-fill"></i><span class="heart-values" aria-hidden="true"><strong id="hp-current"></strong><i></i><small id="hp-max"></small></span></div></div><span id="health-label" data-i18n="Points de vie">Points de vie</span><span id="hp" class="sr-only"></span></div><div class="wallet"><img class="coin" src="https://retrosurvival.online/assets/kama-symbol.svg" alt="" width="29" height="29"><div><b id="kamas"></b><small data-i18n="KAMAS">KAMAS</small></div></div></div><div class="content"><section class="column"><h2 data-i18n="Caractéristiques">Caractéristiques</h2><dl id="stats"></dl></section><section class="column"><h2 data-i18n="Équipement">Équipement</h2><div id="equipment"></div><div id="detail" hidden></div></section></div></section></article><script>
let previous='',selected=null,statsSignature='',equipmentSignature='',collectionSignature='',selectedRelic=null;
const text=value=>window.thorLocale?.text(value)||value;
const el=id=>document.getElementById(id);
function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n;}
window.renderThorDashboard=function(data){
 window.thorLocale?.setLanguage(data.locale||'fr',false);document.documentElement.lang=data.locale||'fr';
 const serialized=JSON.stringify(data);if(previous===serialized)return;previous=serialized;
 document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=text(n.dataset.i18n);});
 renderCollection(data.collection);
 const running=data.status==='run';el('run').hidden=!running;el('empty-state').hidden=running;
 if(!running){el('phase').textContent='Retro Survival';el('empty-state').replaceChildren(node('strong',data.status==='title'?text('À l’aventure !'):text('Personnage indisponible')),node('div',data.status==='title'?text('Lance une partie sur l’écran du haut. Ton personnage et son équipement apparaîtront ici.'):text('Les informations du jeu ne sont pas disponibles pour le moment.')));selected=null;statsSignature=equipmentSignature='';return;}
 el('phase').replaceChildren(node('div',text('Niv. ')+data.level+text(' · Vague ')+data.wave+(data.phase==='paused'?text(' · Pause'):data.phase==='gameover'?text(' · Partie terminée'):'')));
 el('run').className=data.helper?.lowHealth?'danger':'';el('health-label').textContent=text('Points de vie')+(data.helper?.lowHealth?text(' · Danger'):'');
 el('hp').textContent=data.hp+' / '+data.maxHp;el('hp-current').textContent=data.hp;el('hp-max').textContent=data.maxHp;el('hp-meter').setAttribute('aria-label',text('Points de vie'));el('hp-meter').setAttribute('aria-valuenow',data.hp);el('hp-meter').setAttribute('aria-valuemax',data.maxHp);el('health').style.height=Math.max(0,Math.min(100,data.hp/Math.max(1,data.maxHp)*100))+'%';el('kamas').textContent=Number(data.kamas).toLocaleString(data.locale||'fr');
 const nextStats=JSON.stringify([data.locale,data.stats]);if(nextStats!==statsSignature){statsSignature=nextStats;el('stats').replaceChildren(...data.stats.map(s=>{const row=node('div','','stat');row.append(node('dt',s.name));const value=node('dd',s.value??'—');if(s.gear)row.title=text('Bonus équipement : ')+s.gear;row.append(value);return row;}));}
 const nextEquipment=JSON.stringify([data.locale,data.slots,data.items]);if(nextEquipment!==equipmentSignature){equipmentSignature=nextEquipment;const rows=[];for(const [key,label] of ['hat','cape','amulet','weapon','shield','belt','boots','ring'].map(key=>[key,data.slots[key]])){const items=data.items.filter(i=>i.slot===key);for(const item of items){const row=node('div','','slot'+(item?' item':'')+(item?.radiant?' radiant':''));const icon=node('span',item?'':'◇','icon'+(item?' filled':''));if(item?.icon){const img=document.createElement('img');img.src=item.icon;img.alt='';icon.append(img);}const description=node('div','');description.append(node('small',label),node(item?'b':'span',(item?.name||text('Non équipé'))+(item?.radiant?' ★':''),item?'':'empty'));row.append(icon,description);if(item){row.tabIndex=0;row.setAttribute('role','button');row.onclick=()=>{selected=item.name;showDetail(item)};row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}};}rows.push(row);}}
 el('equipment').replaceChildren(...(rows.length?rows:[node('div',text('Non équipé'),'empty')]));}const item=data.items.find(i=>i.name===selected);if(item)showDetail(item);else el('detail').hidden=true;
};
function renderCollection(collection){
 const signature=JSON.stringify([window.thorLocale?.language,collection]);if(signature===collectionSignature)return;collectionSignature=signature;
 if(collection?.status!=='available'){el('collection-count').textContent='—';el('collection-items').replaceChildren();el('collection-note').textContent=text('Collection indisponible');el('collection-detail').hidden=true;selectedRelic=null;return;}
 el('collection-count').textContent=collection.owned+' / '+collection.total;
 el('collection-items').replaceChildren(...collection.entries.map(item=>{const card=node('button','','relic'+(item.owned?'':' locked')+(item.radiant?' radiant':''));const icon=node('img','');icon.src=item.icon;icon.alt='';const info=node('div','');info.append(node('strong',item.name+(item.radiant?' ★':'')),node('small',item.owned?item.bonus:item.level+' · '+text('À obtenir')));card.type='button';card.setAttribute('aria-expanded',String(selectedRelic===item.id));card.title=text('Voir les jets');card.onclick=()=>{selectedRelic=selectedRelic===item.id?null:item.id;collectionSignature='';renderCollection(collection);};card.append(icon,info);return card;}));
 el('collection-note').textContent=text('Conservés entre les parties · meilleur jet gardé');
 const chosen=collection.entries.find(i=>i.id===selectedRelic);el('collection-detail').hidden=!chosen;if(chosen)el('collection-detail').replaceChildren(node('b',chosen.name),...rangeNodes(chosen.ranges),node('div',chosen.owned?text('Jet conservé : ')+chosen.bonus:chosen.level+' · '+text('À obtenir')));
}
function rangeNodes(ranges){return (ranges||[]).map(r=>node('div',r.label+' · '+text('Mini / maxi : ')+r.min+' / '+r.max+(r.unit?' '+r.unit:'')+' · '+text('Rayonnant : ')+r.radiant+(r.unit?' '+r.unit:'')));}
function showDetail(item){el('detail').hidden=false;el('detail').replaceChildren(node('b',item.name),node('div',item.effects||text('Aucun effet indiqué.')),...rangeNodes(item.ranges));}
</script></body></html>
